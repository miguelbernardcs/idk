<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Chat</title>
    <!-- Liga o teu CSS externo aqui se preferires -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA 1: DIGITAR NOME -->
    <div id="telaNome" class="auth-container">
        <span style="font-size: 3rem;">💬</span>
        <h2 id="tituloChat">Meu Chat</h2>
        <input type="text" id="inputNome" placeholder="Digite seu nome..." autocomplete="off">
        <div id="erroNome" class="erro"></div>
        <button onclick="confirmarNome()">Continuar</button>
    </div>

    <!-- TELA 2: CRIAR SENHA (PRIMEIRO ACESSO) -->
    <div id="telaCriarSenha" class="auth-container oculto">
        <span style="font-size: 3rem;">🔒</span>
        <h2>Criar Senha</h2>
        <p style="font-size:0.85rem; color:var(--texto-suave); margin-bottom:15px;">O nome <strong id="nomeCriar"></strong> é novo. Crie uma senha de acesso:</p>
        <input type="password" id="inputNovaSenha" placeholder="Mínimo 4 caracteres">
        <input type="password" id="inputConfirmarSenha" placeholder="Confirme a senha">
        <div id="erroCriarSenha" class="erro"></div>
        <button onclick="criarSenha()">Registar e Entrar</button>
    </div>

    <!-- TELA 3: DIGITAR SENHA (CONTA JÁ EXISTENTE) -->
    <div id="telaSenha" class="auth-container oculto">
        <span style="font-size: 3rem;">🔑</span>
        <h2>Bem-vindo de volta</h2>
        <p style="font-size:0.85rem; color:var(--texto-suave); margin-bottom:15px;">Insira a senha da conta <strong id="nomeSenha"></strong>:</p>
        <input type="password" id="inputSenha" placeholder="Sua senha...">
        <div id="erroSenha" class="erro"></div>
        <button onclick="confirmarSenha()">Entrar</button>
    </div>

    <!-- CONTAINER PRINCIPAL DO CHAT -->
    <div id="appContainer" class="app-container oculto">
        
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <span class="logo">💬</span>
                    <span id="tituloChatHeaderSidebar">Meu Chat</span>
                </div>
                <div class="sidebar-acoes">
                    <button class="btn-icone" onclick="abrirAmigos()" title="Amigos">⭐</button>
                    <button class="btn-icone" onclick="alternarTema()" title="Mudar Tema">🌓</button>
                    <button class="btn-icone" onclick="sairDaConta()" title="Sair">🚪</button>
                </div>
            </div>

            <!-- PERFIL COM FOTO -->
            <div class="user-profile-section">
                <div class="avatar-container" onclick="document.getElementById('inputFotoPerfil').click()" title="Mudar foto de perfil">
                    <img id="minhaFotoPerfil" src="" alt="Perfil" class="foto-perfil-img oculta">
                    <div id="minhaFotoPlaceholder" class="foto-perfil-placeholder">👤</div>
                    <div class="camera-overlay">📷</div>
                </div>
                <span id="meuNome" onclick="abrirMenuConta()" title="Gerir Conta">Nome</span>
                <input type="file" id="inputFotoPerfil" accept="image/*" class="oculto" onchange="atualizarFotoPerfil(this)">
            </div>

            <div class="sidebar-secao">
                <span>Canais</span>
                <button class="btn-icone" onclick="abrirCriarCanal()" title="Criar Canal" style="font-size:0.9rem;">➕</button>
            </div>
            
            <div class="lista-scroll" id="listaGrupos">
                <!-- Canais dinâmicos inseridos via JS -->
            </div>

            <div class="sidebar-secao">
                <span>Utilizadores Online</span>
            </div>
            <div class="lista-online" id="listaOnline">
                <!-- Utilizadores online inseridos via JS -->
            </div>
        </div>

        <!-- ÁREA DO CHAT -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-info">
                    <button class="btn-icone" onclick="toggleSidebar()" style="display:none;" id="btnMenuMobile">☰</button>
                    <span id="tituloChatHeader"># canal</span>
                </div>
            </div>

            <div class="mensagens" id="mensagens">
                <!-- Mensagens inseridas via JS -->
            </div>

            <div class="chat-input-area">
                <button class="btn-icone" onclick="document.getElementById('inputImg').click()" title="Enviar Imagem" style="font-size: 1.3rem;">📷</button>
                <input type="file" id="inputImg" accept="image/*" class="oculto" onchange="enviarImagem(this)">
                <input type="text" id="entrada" placeholder="Escreva uma mensagem..." autocomplete="off">
                <button class="btn-enviar" onclick="enviar()">Enviar</button>
            </div>
        </div>
    </div>

    <!-- PAINEL DE AMIGOS -->
    <div id="painelAmigos" class="painel-lateral oculto">
        <div class="painel-header">
            <span>Os Meus Amigos ⭐</span>
            <button class="btn-icone" onclick="fecharAmigos()">✕</button>
        </div>
        <div class="painel-conteudo">
            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <input type="text" id="inputAmigo" placeholder="Nome do amigo..." class="modal-input" style="margin-bottom:0;">
                <button class="btn-enviar" onclick="adicionarAmigo()">Add</button>
            </div>
            <div id="listaAmigos" style="display: flex; flex-direction: column; gap: 6px;">
                <!-- Lista de amigos injetada via JS -->
            </div>
        </div>
    </div>

    <!-- MODAL PERSONALIZADO GLOBAL -->
    <div id="modalCustomizado" class="modal-overlay oculto">
        <div class="modal-box">
            <div id="modalIcone" class="modal-icon">💬</div>
            <div id="modalTitulo" class="modal-title">Título</div>
            <div id="modalMensagem" class="modal-msg">Mensagem descritiva aqui.</div>
            <input type="text" id="modalInput" class="modal-input oculto" placeholder="">
            <div class="modal-buttons">
                <button id="modalBtnCancelar" class="btn-modal-cancel oculto" onclick="fecharModalCustomizado(false)">Cancelar</button>
                <button class="btn-modal-ok" onclick="fecharModalCustomizado(true)">OK</button>
            </div>
        </div>
    </div>

    <!-- Liga o teu JS externo aqui -->
    <script type="module" src="script.js"></script>
</body>
</html>
